services:
  postgres:
    image: postgres:17-alpine
    container_name: massive_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: price_alert_stocks
    ports:
      - "5443:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # เพิ่มบรรทัดนี้เพื่อรัน backup.sql ในโฟลเดอร์ init-db อัตโนมัติเมื่อสร้าง DB ครั้งแรก
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: massive_nestjs_app
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      DB_DATABASE: price_alert_stocks
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: